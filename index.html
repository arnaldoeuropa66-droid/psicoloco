<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#8B6F4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MenteClara">
<title>MenteClara – Tu Psicólogo de Confianza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF6F0;
    --warm-white: #FDF9F4;
    --sand: #E8D5B7;
    --tan: #C9A87C;
    --brown: #8B6F4E;
    --deep-brown: #5C4033;
    --charcoal: #2C2016;
    --muted: #9A8470;
    --sage: #7A8C6E;
    --blush: #D4907A;
    --error: #C0392B;
    --bubble-user: #5C4033;
    --bubble-ai: #FDF0E3;
    --shadow: 0 4px 24px rgba(92,64,51,0.10);
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── SPLASH / ONBOARDING ─────────────────────────── */
  #splash {
    position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(160deg, #F5EAD7 0%, #E8D5B7 50%, #C9A87C 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px;
    transition: opacity 0.6s ease;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }

  .splash-logo {
    width: 80px; height: 80px;
    background: var(--deep-brown);
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 40px; color: var(--sand);
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(92,64,51,0.25);
  }
  .splash-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px; font-weight: 300;
    color: var(--deep-brown);
    margin-bottom: 6px; letter-spacing: -0.5px;
  }
  .splash-subtitle {
    font-size: 14px; color: var(--brown);
    margin-bottom: 40px; text-align: center;
    line-height: 1.5;
  }

  .splash-card {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 28px;
    width: 100%; max-width: 380px;
    box-shadow: var(--shadow);
  }
  .splash-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 600;
    color: var(--deep-brown);
    margin-bottom: 18px; text-align: center;
  }

  .option-row {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .option-btn {
    flex: 1; padding: 12px 8px;
    border: 2px solid var(--sand);
    border-radius: 14px;
    background: transparent;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: var(--deep-brown);
    transition: all 0.2s;
    text-align: center;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
  }
  .option-btn .opt-icon { font-size: 22px; }
  .option-btn.selected {
    border-color: var(--brown);
    background: var(--brown);
    color: var(--cream);
  }
  .option-btn:hover:not(.selected) {
    border-color: var(--tan);
    background: rgba(201,168,124,0.1);
  }

  .name-input {
    width: 100%; padding: 13px 16px;
    border: 2px solid var(--sand);
    border-radius: 14px;
    background: rgba(255,255,255,0.8);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; color: var(--charcoal);
    outline: none; margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  .name-input:focus { border-color: var(--brown); }
  .name-input::placeholder { color: var(--muted); }

  .start-btn {
    width: 100%; padding: 15px;
    background: var(--deep-brown);
    color: var(--cream);
    border: none; border-radius: 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.3px;
    transition: all 0.2s;
    margin-top: 4px;
  }
  .start-btn:hover { background: var(--brown); transform: translateY(-1px); }
  .start-btn:active { transform: translateY(0); }

  /* ── HEADER ─────────────────────────────────────── */
  #app-header {
    background: var(--warm-white);
    border-bottom: 1px solid var(--sand);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(92,64,51,0.06);
    position: relative; z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--tan), var(--deep-brown));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .header-info h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; font-weight: 600;
    color: var(--deep-brown); line-height: 1;
  }
  .header-info p {
    font-size: 11px; color: var(--sage);
    display: flex; align-items: center; gap: 4px;
  }
  .online-dot {
    width: 6px; height: 6px;
    background: var(--sage); border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.4; }
  }

  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px;
    background: var(--cream);
    border: 1px solid var(--sand);
    border-radius: 10px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.2s;
    position: relative;
  }
  .icon-btn:hover { background: var(--sand); }
  .lang-badge {
    font-size: 10px; font-weight: 500;
    color: var(--brown); letter-spacing: 0.5px;
  }

  /* ── CHAT AREA ───────────────────────────────────── */
  #chat-area {
    flex: 1; overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    background: var(--cream);
  }
  #chat-area::-webkit-scrollbar { width: 4px; }
  #chat-area::-webkit-scrollbar-thumb {
    background: var(--sand); border-radius: 4px;
  }

  .msg {
    display: flex; gap: 8px;
    max-width: 85%;
    animation: msgIn 0.3s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user { margin-left: auto; flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    background: linear-gradient(135deg, var(--tan), var(--deep-brown));
    align-self: flex-end;
  }
  .msg.user .msg-avatar {
    background: var(--deep-brown);
  }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14.5px; line-height: 1.6;
    max-width: 100%;
  }
  .msg.ai .bubble {
    background: var(--bubble-ai);
    color: var(--charcoal);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(92,64,51,0.07);
  }
  .msg.user .bubble {
    background: var(--bubble-user);
    color: var(--cream);
    border-bottom-right-radius: 4px;
  }

  .bubble-meta {
    font-size: 10px; color: var(--muted);
    margin-top: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .msg.user .bubble-meta { justify-content: flex-end; color: rgba(250,246,240,0.5); }

  .speak-btn {
    background: none; border: none;
    cursor: pointer; font-size: 13px;
    opacity: 0.5; transition: opacity 0.2s; padding: 0;
  }
  .speak-btn:hover { opacity: 1; }

  /* typing indicator */
  .typing-bubble {
    display: flex; align-items: center; gap: 4px;
    padding: 14px 18px;
    background: var(--bubble-ai);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(92,64,51,0.07);
  }
  .typing-dot {
    width: 7px; height: 7px;
    background: var(--tan); border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%,80%,100% { transform: scale(0.7); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* date divider */
  .date-divider {
    text-align: center;
    font-size: 11px; color: var(--muted);
    padding: 4px 0;
    position: relative;
  }
  .date-divider::before, .date-divider::after {
    content: ''; position: absolute;
    top: 50%; width: 28%; height: 1px;
    background: var(--sand);
  }
  .date-divider::before { left: 0; }
  .date-divider::after { right: 0; }

  /* ── INPUT BAR ───────────────────────────────────── */
  #input-bar {
    background: var(--warm-white);
    border-top: 1px solid var(--sand);
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .input-row {
    display: flex; align-items: flex-end; gap: 8px;
  }
  .input-wrap {
    flex: 1;
    background: var(--cream);
    border: 2px solid var(--sand);
    border-radius: 20px;
    display: flex; align-items: flex-end;
    padding: 8px 14px;
    transition: border-color 0.2s;
    gap: 8px;
  }
  .input-wrap:focus-within { border-color: var(--tan); }

  #msg-input {
    flex: 1; border: none; background: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14.5px; color: var(--charcoal);
    outline: none; resize: none;
    max-height: 100px; line-height: 1.5;
    overflow-y: auto;
  }
  #msg-input::placeholder { color: var(--muted); }

  .send-btn, .mic-btn {
    width: 40px; height: 40px; flex-shrink: 0;
    border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: all 0.2s;
  }
  .send-btn {
    background: var(--deep-brown); color: var(--cream);
    box-shadow: 0 2px 8px rgba(92,64,51,0.25);
  }
  .send-btn:hover { background: var(--brown); transform: scale(1.05); }
  .send-btn:disabled { background: var(--sand); color: var(--muted); transform: none; box-shadow: none; }

  .mic-btn {
    background: var(--cream); border: 2px solid var(--sand);
    color: var(--brown);
  }
  .mic-btn:hover { background: var(--sand); }
  .mic-btn.recording {
    background: var(--blush); border-color: var(--blush);
    color: white; animation: micPulse 1s infinite;
  }
  @keyframes micPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(212,144,122,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(212,144,122,0); }
  }

  /* ── MODALS ──────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(44,32,22,0.45);
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 0;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal-sheet {
    background: var(--warm-white);
    border-radius: 24px 24px 0 0;
    padding: 24px;
    width: 100%; max-width: 480px;
    transform: translateY(40px);
    transition: transform 0.3s ease;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }

  .modal-handle {
    width: 40px; height: 4px;
    background: var(--sand); border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 600;
    color: var(--deep-brown); margin-bottom: 16px;
  }

  /* Settings modal */
  .setting-group { margin-bottom: 20px; }
  .setting-label {
    font-size: 12px; font-weight: 500;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.8px; margin-bottom: 8px;
  }
  .setting-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .setting-chip {
    padding: 8px 14px;
    border: 2px solid var(--sand);
    border-radius: 20px;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: var(--deep-brown);
    cursor: pointer; transition: all 0.2s;
  }
  .setting-chip.active {
    border-color: var(--brown);
    background: var(--brown); color: var(--cream);
  }

  /* Report modal */
  .report-card {
    background: var(--cream);
    border-radius: 16px; padding: 16px;
    margin-bottom: 12px;
    border-left: 4px solid var(--tan);
  }
  .report-card h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px; color: var(--deep-brown);
    margin-bottom: 6px;
  }
  .report-card p { font-size: 13.5px; color: var(--charcoal); line-height: 1.6; }

  .emotion-bar { margin: 8px 0; }
  .emotion-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 4px;
  }
  .bar-track {
    height: 6px; background: var(--sand);
    border-radius: 3px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--tan), var(--blush));
    transition: width 1s ease;
  }

  .download-btn {
    width: 100%; padding: 14px;
    background: var(--deep-brown); color: var(--cream);
    border: none; border-radius: 14px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px; font-weight: 600;
    cursor: pointer; margin-top: 8px;
    transition: all 0.2s;
  }
  .download-btn:hover { background: var(--brown); }

  /* toast */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--deep-brown); color: var(--cream);
    padding: 10px 20px; border-radius: 20px;
    font-size: 13px; opacity: 0;
    transition: all 0.3s; z-index: 200;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* speaking animation on avatar */
  .speaking { animation: speakPulse 0.6s infinite alternate; }
  @keyframes speakPulse {
    from { box-shadow: 0 0 0 0 rgba(201,168,124,0.5); }
    to   { box-shadow: 0 0 0 8px rgba(201,168,124,0); }
  }

  /* ── RESPONSIVE ──────────────────────────────────── */
  @media (min-width: 480px) {
    body { align-items: center; background: #E8D0B0; }
    #splash { border-radius: 24px; max-width: 420px; max-height: 95dvh; top:50%; left:50%; transform: translate(-50%,-50%); bottom: auto; right: auto; }
    #chat-wrapper {
      width: 100%; max-width: 440px;
      height: 95dvh;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(92,64,51,0.25);
    }
  }
</style>
</head>
<body>

<!-- ── SPLASH SCREEN ─────────────────────────────── -->
<div id="splash">
  <div class="splash-logo">🌿</div>
  <h1 class="splash-title">MenteClara</h1>
  <p class="splash-subtitle">Tu espacio seguro de bienestar emocional<br><em>Your safe emotional wellness space</em></p>

  <div class="splash-card">
    <h3>Cuéntame un poco sobre ti</h3>

    <input class="name-input" id="user-name" type="text"
      placeholder="Tu nombre / Your name" autocomplete="off">

    <div class="setting-group">
      <div class="setting-label">Idioma / Language</div>
      <div class="option-row">
        <button class="option-btn selected" data-group="lang" data-val="es">
          <span class="opt-icon">🇪🇸</span> Español
        </button>
        <button class="option-btn" data-group="lang" data-val="en">
          <span class="opt-icon">🇺🇸</span> English
        </button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">Voz del psicólogo / Therapist voice</div>
      <div class="option-row">
        <button class="option-btn selected" data-group="voice" data-val="female">
          <span class="opt-icon">👩</span>
          <span id="v-female-lbl">Femenina</span>
        </button>
        <button class="option-btn" data-group="voice" data-val="male">
          <span class="opt-icon">👨</span>
          <span id="v-male-lbl">Masculina</span>
        </button>
      </div>
    </div>

    <button class="start-btn" onclick="startApp()">
      Comenzar sesión ✦
    </button>
  </div>
</div>

<!-- ── MAIN APP ───────────────────────────────────── -->
<div id="chat-wrapper" style="display:none; flex-direction:column; height:100dvh; width:100%;">

  <div id="app-header">
    <div class="header-left">
      <div class="avatar" id="main-avatar">🌿</div>
      <div class="header-info">
        <h2 id="therapist-name">Dra. Sofía</h2>
        <p><span class="online-dot"></span> <span id="online-txt">En línea • MenteClara</span></p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openSettings()" title="Ajustes">⚙️</button>
      <button class="icon-btn" onclick="openReport()" title="Reporte">📋</button>
      <button class="icon-btn" style="padding:0 6px;" onclick="toggleLang()" title="Idioma">
        <span class="lang-badge" id="lang-toggle-btn">ES</span>
      </button>
    </div>
  </div>

  <div id="chat-area"></div>

  <div id="input-bar">
    <div class="input-row">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Voz">🎙️</button>
      <div class="input-wrap">
        <textarea id="msg-input" rows="1"
          placeholder="Escribe un mensaje..."
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"></textarea>
      </div>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Enviar">➤</button>
    </div>
  </div>
</div>

<!-- ── SETTINGS MODAL ─────────────────────────────── -->
<div class="modal-overlay" id="settings-modal" onclick="closeOnOverlay(event,'settings-modal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="settings-title">⚙️ Ajustes</div>

    <div class="setting-group">
      <div class="setting-label" id="s-lang-lbl">Idioma</div>
      <div class="setting-options">
        <button class="setting-chip" id="chip-es" onclick="setLang('es')">🇪🇸 Español</button>
        <button class="setting-chip" id="chip-en" onclick="setLang('en')">🇺🇸 English</button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label" id="s-voice-lbl">Voz</div>
      <div class="setting-options">
        <button class="setting-chip" id="chip-female" onclick="setVoice('female')">👩 <span id="chip-female-lbl">Femenina</span></button>
        <button class="setting-chip" id="chip-male" onclick="setVoice('male')">👨 <span id="chip-male-lbl">Masculina</span></button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label" id="s-speed-lbl">Velocidad de voz</div>
      <div class="setting-options">
        <button class="setting-chip" id="chip-slow" onclick="setSpeed(0.85)">🐢 Lenta</button>
        <button class="setting-chip active" id="chip-normal" onclick="setSpeed(1)">▶ Normal</button>
        <button class="setting-chip" id="chip-fast" onclick="setSpeed(1.2)">⚡ Rápida</button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label" id="s-audio-lbl">Audio automático</div>
      <div class="setting-options">
        <button class="setting-chip" id="chip-auto-on" onclick="setAutoSpeak(true)">🔊 Activado</button>
        <button class="setting-chip active" id="chip-auto-off" onclick="setAutoSpeak(false)">🔇 <span id="auto-off-lbl">Desactivado</span></button>
      </div>
    </div>
  </div>
</div>

<!-- ── REPORT MODAL ───────────────────────────────── -->
<div class="modal-overlay" id="report-modal" onclick="closeOnOverlay(event,'report-modal')">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="report-title">📋 Reporte de sesión</div>
    <div id="report-content"></div>
    <button class="download-btn" onclick="downloadReport()" id="download-btn">⬇ Descargar PDF</button>
  </div>
</div>

<!-- ── TOAST ─────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
// ── STATE ─────────────────────────────────────────
const state = {
  lang: 'es',
  voice: 'female',
  speed: 1,
  autoSpeak: false,
  userName: '',
  history: [],        // [{role, content}]
  sessionStart: new Date(),
  msgCount: 0,
};

const TEXTS = {
  es: {
    placeholder: 'Escribe un mensaje...',
    online: 'En línea • MenteClara',
    therapistF: 'Dra. Sofía',
    therapistM: 'Dr. Mateo',
    voiceF: 'Femenina',
    voiceM: 'Masculina',
    settingsTitle: '⚙️ Ajustes',
    langLbl: 'Idioma',

// ── VOICES ────────────────────────────────────────
let voices = [];
window.speechSynthesis.onvoiceschanged = () => {
  voices = window.speechSynthesis.getVoices();
};
setTimeout(() => { voices = window.speechSynthesis.getVoices(); }, 500);

function getBestVoice(gender, lang) {
  const langCode = lang === 'es' ? 'es' : 'en';
  const genderName = gender === 'female'
    ? ['female','mujer','woman','sofia','lucia','maria','isabella','paulina','elena','daniela','valeria','ximena']
    : ['male','hombre','man','jorge','carlos','diego','miguel','alejandro','juan','mateo','pablo'];

  // try to find lang+gender match
  let found = voices.find(v =>
    v.lang.toLowerCase().startsWith(langCode) &&
    genderName.some(g => v.name.toLowerCase().includes(g))
  );
  // fallback: just lang
  if (!found) found = voices.find(v => v.lang.toLowerCase().startsWith(langCode));
  // fallback: gender keyword any lang
  if (!found) found = voices.find(v => genderName.some(g => v.name.toLowerCase().includes(g)));
  return found || null;
}

function speak(text, onEnd) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  const v = getBestVoice(state.voice, state.lang);
  if (v) utt.voice = v;
  utt.rate = state.speed;
  utt.pitch = state.voice === 'female' ? 1.1 : 0.9;
  utt.lang = state.lang === 'es' ? 'es-ES' : 'en-US';
  const avatar = document.getElementById('main-avatar');
  utt.onstart = () => avatar && avatar.classList.add('speaking');
  utt.onend = () => {
    avatar && avatar.classList.remove('speaking');
    onEnd && onEnd();
  };
  window.speechSynthesis.speak(utt);
}

// ── SPEECH RECOGNITION ───────────────────────────
let recognition = null;
let isRecording = false;

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = state.lang === 'es' ? 'es-ES' : 'en-US';
  r.interimResults = false;
  r.continuous = false;
  r.onresult = e => {
    const txt = e.results[0][0].transcript;
    document.getElementById('msg-input').value = txt;
    autoResize(document.getElementById('msg-input'));
    stopMic();
    sendMessage();
  };
  r.onerror = () => stopMic();
  r.onend = () => stopMic();
  return r;
}

function toggleMic() {
  if (isRecording) { stopMic(); return; }
  recognition = initRecognition();
  if (!recognition) { showToast('Micrófono no soportado en este navegador'); return; }
  recognition.start();
  isRecording = true;
  const btn = document.getElementById('mic-btn');
  btn.classList.add('recording');
  btn.textContent = '⏹️';
  showToast(TEXTS[state.lang].micOn);
}

function stopMic() {
  isRecording = false;
  if (recognition) { try { recognition.stop(); } catch(e){} }
  const btn = document.getElementById('mic-btn');
  btn.classList.remove('recording');
  btn.textContent = '🎙️';
}

// ── SPLASH LOGIC ──────────────────────────────────
document.querySelectorAll('.option-btn[data-group]').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    document.querySelectorAll(`.option-btn[data-group="${group}"]`)
      .forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    if (group === 'lang') state.lang = btn.dataset.val;
    if (group === 'voice') state.voice = btn.dataset.val;
  });
});

function startApp() {
  const nameEl = document.getElementById('user-name');
  state.userName = nameEl.value.trim() || (state.lang === 'es' ? 'amigo' : 'friend');
  document.getElementById('splash').classList.add('hidden');
  const wrapper = document.getElementById('chat-wrapper');
  wrapper.style.display = 'flex';
  applyLang();
  sendWelcome();
}

// ── WELCOME ───────────────────────────────────────
function sendWelcome() {
  const name = state.userName;
  const msg = state.lang === 'es'
    ? `Hola ${name} 🌿 Soy la Dra. Sofía, tu espacio de escucha en MenteClara. Este es un lugar seguro y confidencial. ¿Cómo te has sentido últimamente?`
    : `Hello ${name} 🌿 I'm Dr. Sophia, your listening space at MenteClara. This is a safe and confidential space. How have you been feeling lately?`;
  addMessage('ai', msg);
  if (state.autoSpeak) speak(msg);
}

// ── MESSAGES ──────────────────────────────────────
function addMessage(role, text, animate = true) {
  const area = document.getElementById('chat-area');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  if (!animate) wrap.style.animation = 'none';

  const isAI = role === 'ai';
  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar';
  avatarEl.textContent = isAI ? '🌿' : (state.userName[0]?.toUpperCase() || '😊');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  const meta = document.createElement('div');
  meta.className = 'bubble-meta';
  const now = new Date();
  meta.innerHTML = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

  if (isAI) {
    const speakBtn = document.createElement('button');
    speakBtn.className = 'speak-btn';
    speakBtn.textContent = '🔊';
    speakBtn.onclick = () => speak(text);
    meta.appendChild(speakBtn);
  }

  const inner = document.createElement('div');
  inner.appendChild(bubble);
  inner.appendChild(meta);
  inner.style.maxWidth = '100%';

  if (isAI) { wrap.appendChild(avatarEl); wrap.appendChild(inner); }
  else { wrap.appendChild(inner); wrap.appendChild(avatarEl); }

  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;

  state.history.push({ role: isAI ? 'assistant' : 'user', content: text });
  state.msgCount++;
}

function showTyping() {
  const area = document.getElementById('chat-area');
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  wrap.id = 'typing-indicator';

  const av = document.createElement('div');
  av.className = 'msg-avatar'; av.textContent = '🌿';

  const tb = document.createElement('div');
  tb.className = 'typing-bubble';
  [1,2,3].forEach(() => {
    const d = document.createElement('div');
    d.className = 'typing-dot'; tb.appendChild(d);
  });
  wrap.appendChild(av); wrap.appendChild(tb);
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// ── SEND / API ─────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; autoResize(input);

  addMessage('user', text);
  showTyping();

  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  try {
    const messages = state.history.slice(0, -1); // exclude last (just added)
    // re-add last user msg properly
    messages.push({ role: 'user', content: text });

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT(state.userName, state.lang),
        messages: messages
      })
    });

    const data = await resp.json();
    removeTyping();

    const reply = data.content?.[0]?.text || (state.lang === 'es'
      ? 'Lo siento, hubo un problema. ¿Puedes intentarlo de nuevo?'
      : 'Sorry, there was an issue. Can you try again?');

    // Fix history: remove user msg added by addMessage, rebuild correctly
    state.history.pop(); // remove assistant placeholder added by addMessage in sendWelcome
    // Actually history was built correctly, just add assistant reply
    addMessage('ai', reply);
    // Auto-remove duplicate in history (addMessage pushes again)
    // We need to fix: addMessage pushes to history too, but we already pushed user msg
    // Let's just remove the extra user entry
    if (state.history.filter(h=>h.role==='user').length > state.history.filter(h=>h.role==='assistant').length + 1) {
      state.history.splice(state.history.length - 2, 1);
    }

    if (state.autoSpeak) speak(reply);

  } catch (err) {
    removeTyping();
    showToast(TEXTS[state.lang].sendErr);
  }

  btn.disabled = false;
}

// ── REPORT ────────────────────────────────────────
async function openReport() {
  const modal = document.getElementById('report-modal');
  modal.classList.add('open');
  const content = document.getElementById('report-content');
  content.innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">Generando reporte...</p>';

  if (state.history.length < 4) {
    content.innerHTML = `<p style="color:var(--muted);padding:8px">${TEXTS[state.lang].noReport}</p>`;
    return;
  }

  try {
    const reportPrompt = state.lang === 'es'
      ? `Basándote en la siguiente conversación de terapia, genera un reporte psicológico estructurado en JSON con estas claves: {"resumen": "...", "estadoEmocional": "...", "patrones": "...", "recomendaciones": "...", "nivelRiesgo": "bajo|medio|alto", "emociones": {"ansiedad": 0-100, "tristeza": 0-100, "estres": 0-100, "bienestar": 0-100}}. Solo JSON, sin texto adicional.`
      : `Based on the following therapy conversation, generate a structured psychological report in JSON with keys: {"resumen": "...", "estadoEmocional": "...", "patrones": "...", "recomendaciones": "...", "nivelRiesgo": "low|medium|high", "emociones": {"anxiety": 0-100, "sadness": 0-100, "stress": 0-100, "wellbeing": 0-100}}. JSON only, no extra text.`;

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: reportPrompt + '\n\nConversación:\n' +
            state.history.map(h => `${h.role === 'user' ? state.userName : 'Terapeuta'}: ${h.content}`).join('\n')
        }]
      })
    });

    const data = await resp.json();
    const raw = data.content?.[0]?.text || '{}';
    const clean = raw.replace(/```json|```/g, '').trim();
    const report = JSON.parse(clean);
    renderReport(report, content);
    document.getElementById('download-btn').dataset.report = JSON.stringify(report);

  } catch (e) {
    content.innerHTML = `<p style="color:var(--muted);padding:8px">${TEXTS[state.lang].noReport}</p>`;
  }
}

function renderReport(r, container) {
  const lang = state.lang;
  const labels = lang === 'es'
    ? { summary: 'Resumen', emotional: 'Estado emocional', patterns: 'Patrones identificados', recs: 'Recomendaciones', risk: 'Nivel de riesgo', emotions: ['Ansiedad','Tristeza','Estrés','Bienestar'] }
    : { summary: 'Summary', emotional: 'Emotional state', patterns: 'Identified patterns', recs: 'Recommendations', risk: 'Risk level', emotions: ['Anxiety','Sadness','Stress','Wellbeing'] };

  const riskColor = { bajo:'var(--sage)', bajo_:'var(--sage)', low:'var(--sage)', medio:'#D4A020', medium:'#D4A020', alto:'var(--blush)', high:'var(--blush)' };
  const rc = riskColor[r.nivelRiesgo] || 'var(--tan)';

  const emos = r.emociones || {};
  const emoKeys = Object.keys(emos);
  const emoLabels = labels.emotions;

  const sessionMins = Math.round((new Date() - state.sessionStart) / 60000);

  container.innerHTML = `
    <div class="report-card">
      <h4>${labels.summary}</h4>
      <p>${r.resumen || '–'}</p>
    </div>
    <div class="report-card">
      <h4>${labels.emotional}</h4>
      <p>${r.estadoEmocional || '–'}</p>
    </div>
    <div class="report-card">
      <h4>${labels.patterns}</h4>
      <p>${r.patrones || '–'}</p>
    </div>
    <div class="report-card">
      <h4>${labels.recs}</h4>
      <p>${r.recomendaciones || '–'}</p>
    </div>
    <div class="report-card" style="border-left-color:${rc}">
      <h4>${labels.risk}</h4>
      <p style="color:${rc};font-weight:500;text-transform:capitalize">${r.nivelRiesgo || '–'}</p>
    </div>
    <div class="report-card">
      <h4>${lang === 'es' ? 'Mapa emocional' : 'Emotional map'}</h4>
      ${emoKeys.map((k, i) => `
        <div class="emotion-bar">
          <div class="emotion-label">
            <span>${emoLabels[i] || k}</span>
            <span>${emos[k]}%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${emos[k]}%"></div>
          </div>
        </div>
      `).join('')}
    </div>
    <p style="font-size:11px;color:var(--muted);margin-top:8px;text-align:center">
      ${lang === 'es' ? `Sesión: ${sessionMins} min • ${state.msgCount} mensajes • ${new Date().toLocaleDateString('es-ES')}` : `Session: ${sessionMins} min • ${state.msgCount} messages • ${new Date().toLocaleDateString('en-US')}`}
    </p>
    <p style="font-size:11px;color:var(--blush);text-align:center;margin-top:4px">
      ⚠️ ${lang === 'es' ? 'Este reporte es orientativo. No reemplaza diagnóstico profesional.' : 'This report is guidance only. Not a professional diagnosis.'}
    </p>
  `;
}

</body></html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `MenteClara-Reporte-${date.replace(/\//g,'-')}.html`;
  a.click();
  showToast(lang === 'es' ? '¡Reporte descargado!' : 'Report downloaded!');
}

  updateSettingsChips();

function updateSettingsChips() {
  document.getElementById('chip-es').className = 'setting-chip' + (state.lang==='es'?' active':'');
  document.getElementById('chip-en').className = 'setting-chip' + (state.lang==='en'?' active':'');
  document.getElementById('chip-female').className = 'setting-chip' + (state.voice==='female'?' active':'');
  document.getElementById('chip-male').className = 'setting-chip' + (state.voice==='male'?' active':'');
  document.getElementById('chip-auto-on').className = 'setting-chip' + (state.autoSpeak?' active':'');
  document.getElementById('chip-auto-off').className = 'setting-chip' + (!state.autoSpeak?' active':'');
}

function setLang(l) { state.lang = l; applyLang(); updateSettingsChips(); }
function setVoice(v) { state.voice = v; updateSettingsChips(); }
function setSpeed(s) {
  state.speed = s;
  ['slow','normal','fast'].forEach(id => document.getElementById(`chip-${id}`).className = 'setting-chip');
  const map = { 0.85:'slow', 1:'normal', 1.2:'fast' };
  document.getElementById(`chip-${map[s]}`).className = 'setting-chip active';
}
function setAutoSpeak(v) { state.autoSpeak = v; updateSettingsChips(); }

function toggleLang() {
  setLang(state.lang === 'es' ? 'en' : 'es');

}

function applyLang() {
  const t = TEXTS[state.lang];
  document.getElementById('msg-input').placeholder = t.placeholder;

  document.getElementById('therapist-name').textContent = state.voice === 'female' ? t.therapistF : t.therapistM;

  document.getElementById('s-speed-lbl').textContent = t.speedLbl;
  document.getElementById('s-audio-lbl').textContent = t.audioLbl;
  document.getElementById('auto-off-lbl').textContent = t.autoOff;
  document.getElementById('chip-female-lbl').textContent = t.voiceF;
  document.getElementById('chip-male-lbl').textContent = t.voiceM;
  document.getElementById('v-female-lbl').textContent = t.voiceF;

}

// ── UTILS ─────────────────────────────────────────
function closeOnOverlay(e, id) {
  if (e.target.id === id) document.getElementById(id).classList.remove('open');
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
function showToast(msg, duration = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}
